# One command brings up Postgres + API + UI locally:  docker compose up --build
# UI: http://localhost:5173   API: http://localhost:8000   Docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger   # local-only throwaway credentials
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ledger:ledger@db:5432/ledger
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: INFO
      SEED_ON_START: "true"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
