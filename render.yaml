# Render Blueprint for the API. The UI is deployed separately on Vercel (frontend/vercel.json).
# DATABASE_URL and CORS_ORIGINS are entered in the Render dashboard (sync: false) so no secret is in git.
services:
  - type: web
    name: stock-ledger-api
    runtime: docker
    # Paths are given from the repo root so they do not depend on how rootDir is resolved.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths: ["backend/**", "render.yaml"]
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: SEED_ON_START
        value: "true"
