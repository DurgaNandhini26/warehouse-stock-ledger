[project]
name = "stock-ledger-api"
version = "1.0.0"
description = "Warehouse Stock Ledger API (KJBN Problem 3)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() in defaults is idiomatic
    "UP046",  # keep Generic[T] for pydantic generic models
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff.lint.isort]
known-first-party = ["app"]
